      # DB Config
      POSTGRES_USER: ${TASK_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TASK_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TASK_SERVICE_POSTGRES_DB}
      # CRITICAL: List ALL DB nodes here for failover support
      POSTGRES_HOST: db_task_primary,db_task_replica_1,db_task_replica_2
      POSTGRES_PORT: "5432"
    networks:
      - app-network
    deploy:
      replicas: 2
      endpoint_mode: dnsrr
    depends_on:
      discovery-service:
        condition: service_healthy
      db_task_primary:
        condition: service_healthy

  # --- FAILOVER MONITOR ---
  task-failover-monitor:
    image: python:3.10-slim
    container_name: task-failover-monitor
    depends_on:
      - db_task_primary
    volumes:
      - task_failover_triggers:/triggers
    networks:
      - app-network
    command: |
      bash -c '
      pip install psycopg2-binary &&
      cat <<EOF > /monitor.py
      import socket, time, os

      TARGET = "db_task_primary"
      TRIGGER = "/triggers/promote_task"

      def is_reachable(host, port=5432):
          try:
              sock = socket.create_connection((host, port), timeout=2)
              sock.close()
              return True
          except Exception:
              return False

      print(f"Monitoring {TARGET}...")
      while True:
          try:
              if is_reachable(TARGET):
                  if os.path.exists(TRIGGER): os.remove(TRIGGER)
              else:
                  print(f"ALERT: {TARGET} DOWN. Triggering Failover...")
                  with open(TRIGGER, "w") as f: f.write("promote")
                  time.sleep(10) # Wait to prevent flapping
          except Exception as e:
              print(f"Error: {e}")
          time.sleep(5)
      EOF
      python3 -u /monitor.py
      '

  db_task_primary:
    image: postgres:17
    container_name: db_task_primary
    environment:
      - POSTGRES_USER=${TASK_SERVICE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${TASK_SERVICE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${TASK_SERVICE_POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=trust
    command: |
      bash -c "
      # 1. Custom HBA for immediate permission access
      echo 'local all all trust' > /tmp/custom_pg_hba.conf
      echo 'host all all 0.0.0.0/0 trust' >> /tmp/custom_pg_hba.conf
      echo 'host replication all 0.0.0.0/0 trust' >> /tmp/custom_pg_hba.conf
      chown postgres:postgres /tmp/custom_pg_hba.conf
      chmod 600 /tmp/custom_pg_hba.conf

      # 2. Start Postgres
      exec docker-entrypoint.sh postgres -c hba_file=/tmp/custom_pg_hba.conf -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby_feedback=on
      "
    volumes:
      - task_primary_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TASK_SERVICE_POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  db_task_replica_1:
    image: postgres:17
    container_name: db_task_replica_1
    depends_on:
      db_task_primary:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${TASK_SERVICE_POSTGRES_USER}
      - PGPASSWORD=${TASK_SERVICE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${TASK_SERVICE_POSTGRES_DB}
    volumes:
      - task_replica1_data:/var/lib/postgresql/data
      - task_failover_triggers:/triggers
    networks:
      - app-network
    command: |
      bash -c "
      set -e
      # Restart Check
      if [ -f /triggers/promote_task.done ] && [ -f /var/lib/postgresql/data/PG_VERSION ]; then
          echo '!!! ALREADY MASTER. Starting...'
          rm -f /var/lib/postgresql/data/standby.signal
          exec gosu postgres postgres
      fi

      while true; do
          # Failover Check
          if [ -f /triggers/promote_task ]; then
             echo '!!! FAILOVER TRIGGERED !!!'

             # Cold Start Logic (If Primary Dead + No Data)
             if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
                 if pg_isready -h db_task_primary -p 5432 -U ${TASK_SERVICE_POSTGRES_USER}; then
                     echo 'Primary is ALIVE. Retrying sync...'
                 else
                     echo 'WARNING: Primary Dead + No Data. Creating FRESH DB...'
                     mv /triggers/promote_task /triggers/promote_task.done
                     rm -rf /var/lib/postgresql/data/*
                     chown postgres:postgres /var/lib/postgresql/data
                     chmod 0700 /var/lib/postgresql/data

                     gosu postgres initdb -D /var/lib/postgresql/data
                     gosu postgres pg_ctl -D /var/lib/postgresql/data -w start
                     gosu postgres psql -c \"CREATE USER ${TASK_SERVICE_POSTGRES_USER} WITH PASSWORD '${TASK_SERVICE_POSTGRES_PASSWORD}';\"
                     gosu postgres psql -c \"ALTER USER ${TASK_SERVICE_POSTGRES_USER} WITH SUPERUSER;\"
                     gosu postgres psql -c \"CREATE DATABASE ${TASK_SERVICE_POSTGRES_DB} OWNER ${TASK_SERVICE_POSTGRES_USER};\"
                     gosu postgres pg_ctl -D /var/lib/postgresql/data -m fast -w stop

                     echo \"host all all 0.0.0.0/0 trust\" >> /var/lib/postgresql/data/pg_hba.conf
                     echo 'Starting NEW Master...'
                     exec gosu postgres postgres
                 fi
             fi

             mv /triggers/promote_task /triggers/promote_task.done
             rm -f /var/lib/postgresql/data/standby.signal
             exec gosu postgres postgres
          fi

          if pg_isready -h db_task_primary -p 5432 -U ${TASK_SERVICE_POSTGRES_USER}; then
              rm -rf /var/lib/postgresql/data/*
              chmod 0700 /var/lib/postgresql/data
              # Smart Backup: Try Create (-C), fallback to Use (-S)
              if gosu postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R -C -S task_slot_1 --host=db_task_primary --port=5432 --username=${TASK_SERVICE_POSTGRES_USER} --no-password; then
                  break 
              fi
              if gosu postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R -S task_slot_1 --host=db_task_primary --port=5432 --username=${TASK_SERVICE_POSTGRES_USER} --no-password; then
                   break
              fi
          fi
          sleep 2
      done

      # Background Watcher
      (
        while true; do
          sleep 2
          if [ -f /triggers/promote_task ]; then
            gosu postgres pg_ctl promote -D /var/lib/postgresql/data
            mv /triggers/promote_task /triggers/promote_task.done
            break
          fi
        done
      ) &
      exec gosu postgres postgres -c hot_standby=on
      "

  db_task_replica_2:
