              if gosu postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R -S char_slot_1 --host=db_character_primary --port=5432 --username=${CHARACTER_SERVICE_POSTGRES_USER} --no-password; then
                   echo 'Backup Successful (Existing Slot)!'
                   break
              fi
          fi
          sleep 2
      done

      # 3. Watcher
      (
        while true; do
          sleep 2
          if [ -f /triggers/promote_character ]; then
            gosu postgres pg_ctl promote -D /var/lib/postgresql/data
            mv /triggers/promote_character /triggers/promote_character.done
            break
          fi
        done
      ) &
      exec gosu postgres postgres -c hot_standby=on
      "

