      rm -rf /var/lib/postgresql/data/*
      chown -R postgres:postgres /var/lib/postgresql/data
      chmod 0700 /var/lib/postgresql/data
      until gosu postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replica_2 --host=rumours-postgres-primary --port=5432 --username=${RUMOURS_POSTGRES_USER} --no-password; do
        echo 'Waiting for primary...'
        sleep 1s
      done
      exec gosu postgres postgres -c hot_standby=on
      "
    volumes:
      - rumours_replica2_data:/var/lib/postgresql/data
    networks:
      - app-network

  communication-service:
    image: m1rrerror/mafia-communication-service:latest
    environment:
      ConnectionStrings__DefaultConnection: "Host=comm-postgres-primary,comm-postgres-replica-1,comm-postgres-replica-2;Database=${COMM_POSTGRES_DB};Username=${COMM_POSTGRES_USER};Password=${COMM_POSTGRES_PASSWORD};Target Session Attributes=read-write"
      DISCOVERY_SERVICE_URL: ${DISCOVERY_SERVICE_URL}
      SERVICE_HOST: communication-service
      SERVICE_PORT: 8080
      RPC_PORT: 6000
      DISCOVERY_SERVICE_GRPC_URL: "http://discovery-service:6565"
      SERVICE_TOPIC: "chat-topic"
      SUBSCRIBED_TOPICS: "chat-events"
      SERVICE_ID: communication-service
      COMMUNICATION_SERVICE_POSTGRES_USER: ${COMM_POSTGRES_USER}
      COMMUNICATION_SERVICE_POSTGRES_PASSWORD: ${COMM_POSTGRES_PASSWORD}
      COMMUNICATION_SERVICE_POSTGRES_DB: ${COMM_POSTGRES_DB}
    depends_on:
      comm-postgres-primary:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      replicas: 2
      endpoint_mode: dnsrr

  comm-postgres-primary:
    image: postgres:17
    container_name: comm-postgres-primary
    environment:
      POSTGRES_USER: ${COMM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${COMM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${COMM_POSTGRES_DB}
    command: |
      bash -c "
      echo \"echo 'host replication all 0.0.0.0/0 scram-sha-256' >> /var/lib/postgresql/data/pg_hba.conf\" > /docker-entrypoint-initdb.d/01_init_hba.sh
      echo \"SELECT 'init' FROM pg_create_physical_replication_slot('replica_1'); SELECT 'init' FROM pg_create_physical_replication_slot('replica_2');\" > /docker-entrypoint-initdb.d/02_init_slots.sql
      exec docker-entrypoint.sh postgres -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby_feedback=on
      "
    volumes:
      - comm_primary_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMM_POSTGRES_USER} -d ${COMM_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  comm-postgres-replica-1:
    image: postgres:17
    depends_on:
      comm-postgres-primary:
        condition: service_healthy
    environment:
      PGPASSWORD: ${COMM_POSTGRES_PASSWORD}
    command: |
      bash -c "
      rm -rf /var/lib/postgresql/data/*
      chown -R postgres:postgres /var/lib/postgresql/data
      chmod 0700 /var/lib/postgresql/data
      until gosu postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replica_1 --host=comm-postgres-primary --port=5432 --username=${COMM_POSTGRES_USER} --no-password; do
        echo 'Waiting for primary...'
        sleep 1s
      done
      exec gosu postgres postgres -c hot_standby=on
      "
    volumes:
      - comm_replica1_data:/var/lib/postgresql/data
    networks:
      - app-network

  comm-postgres-replica-2:
    image: postgres:17
    depends_on:
      comm-postgres-primary:
        condition: service_healthy
    environment:
      PGPASSWORD: ${COMM_POSTGRES_PASSWORD}
    command: |
      bash -c "
      rm -rf /var/lib/postgresql/data/*
      chown -R postgres:postgres /var/lib/postgresql/data
      chmod 0700 /var/lib/postgresql/data
      until gosu postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replica_2 --host=comm-postgres-primary --port=5432 --username=${COMM_POSTGRES_USER} --no-password; do
        echo 'Waiting for primary...'
        sleep 1s
      done
      exec gosu postgres postgres -c hot_standby=on
      "
    volumes:
      - comm_replica2_data:/var/lib/postgresql/data
    networks:
      - app-network

  db_user_management_service:
    image: postgres:14
    environment:
      POSTGRES_USER: ${USER_MANAGEMENT_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_MANAGEMENT_SERVICE_POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - user_management_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_MANAGEMENT_SERVICE_POSTGRES_USER} -d ${USER_MANAGEMENT_SERVICE_POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  user-management-service:
    image: alexandrina581/user-management-service:latest
    pull_policy: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 80
    ports:
      - "6567:6565"
    env_file:
      - .env
    environment:
      SERVICE_NAME: user-management-service
      HOSTNAME: user-management-service
      RPC_PORT: 6565
      TOPIC_NAME: user-management
      MESSAGE_BROKER_GRPC_URL: message-broker:6565
      DISCOVERY_SERVICE_GRPC_URL: discovery-service:6565
      SERVICE_PORT: 80
      USER_MANAGEMENT_SERVICE_POSTGRES_USER: ${USER_MANAGEMENT_SERVICE_POSTGRES_USER}
      USER_MANAGEMENT_SERVICE_POSTGRES_PASSWORD: ${USER_MANAGEMENT_SERVICE_POSTGRES_PASSWORD}
      USER_MANAGEMENT_SERVICE_POSTGRES_DB: ${USER_MANAGEMENT_SERVICE_POSTGRES_DB}
      USER_MANAGEMENT_SERVICE_POSTGRES_HOST: db_user_management_service
      USER_MANAGEMENT_SERVICE_POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
    depends_on:
      db_user_management_service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
    labels:
      logging: "promtail"
      logging_jobname: "user-management-service"

  db_game_service:
    image: postgres:14
    environment:
      POSTGRES_USER: ${GAME_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GAME_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${GAME_SERVICE_POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - game_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${GAME_SERVICE_POSTGRES_USER} -d ${GAME_SERVICE_POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  game-service:
    image: alexandrina581/game-service:latest
    pull_policy: always
    ports:
      - "6568:6565"
      - "8090:80"
    env_file:
      - .env
    environment:
      SERVICE_NAME: game-service
      SERVICE_HOST: game-service
      SERVICE_PORT: 80
      GRPC_PORT: 6565
      SERVICE_PROTOCOL: http
      SERVICE_TAGS: game,python,websocket,grpc
      PORT: 80
      DISCOVERY_SERVICE_URL: http://discovery-service:8989
      DISCOVERY_SERVICE_GRPC_URL: discovery-service:6565
      MESSAGE_BROKER_GRPC_URL: message-broker:6565
      TOPIC_EVENTS: game-events
      TOPIC_TASK_SERVICE: task-service
      TOPIC_ROLEPLAY_SERVICE: roleplay-service
      GAME_SERVICE_POSTGRES_USER: ${GAME_SERVICE_POSTGRES_USER}
      GAME_SERVICE_POSTGRES_PASSWORD: ${GAME_SERVICE_POSTGRES_PASSWORD}
      GAME_SERVICE_POSTGRES_DB: ${GAME_SERVICE_POSTGRES_DB}
      GAME_SERVICE_POSTGRES_HOST: db_game_service
      GAME_SERVICE_POSTGRES_PORT: 5432
    depends_on:
      db_game_service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
    labels:
      logging: "promtail"
      logging_jobname: "game-service"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-network
    depends_on:
      discovery-service:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - app-network

  loki:
    image: grafana/loki:2.9.1
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - app-network

networks:
  app-network:
