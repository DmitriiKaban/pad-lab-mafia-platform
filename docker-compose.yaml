services:

  data-warehouse:
    image: postgres:17
    environment:
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_password
      POSTGRES_DB: data_warehouse
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    networks:
      - app-network
    deploy:
      replicas: 1

  failover-monitor:
    image: python:3.10-slim
    container_name: failover-monitor
    depends_on:
      - db_town_primary
    volumes:
      - failover_triggers:/triggers
    networks:
      - app-network
    command: |
      bash -c '
      pip install psycopg2-binary &&
      cat <<EOF > /monitor.py
      import socket, time, os
      
      # CONFIG
      MONITOR_CONFIG = {
          "db_town_primary": "/triggers/promote_town",
          "db_character_primary": "/triggers/promote_character"
      }
      
      def is_reachable(host, port=5432):
          try:
              sock = socket.create_connection((host, port), timeout=2)
              sock.close()
              return True
          except Exception:
              return False
      
      print("Starting Multi-Service Failover Monitor...")
      
      while True:
          for host in list(MONITOR_CONFIG.keys()):
              trigger_file = MONITOR_CONFIG[host]
              try:
                  if is_reachable(host):
                      if os.path.exists(trigger_file):
                          os.remove(trigger_file)
                          print(f"INFO: {host} recovered. Cleared trigger.")
                  else:
                      print(f"ALERT: {host} DOWN. Triggering {trigger_file}")
                      with open(trigger_file, "w") as f:
                          f.write("promote")
                      # Pause monitoring this host
                      MONITOR_CONFIG.pop(host)
              except Exception as e:
                  print(f"ERROR {host}: {e}")
      
          if not MONITOR_CONFIG:
              print("All services triggered. Pausing...")
              time.sleep(60)
          time.sleep(5)
      EOF
      python3 -u /monitor.py
      '
    deploy:
      replicas: 1

  etl-service:
    image: dimaubuntu/etl-service:latest
    container_name: etl-service
    depends_on:
      - data-warehouse
      - db_town_primary
      - db_character_primary
      - db_task_primary
      - db_voting_primary
      - db_user_management_service
    environment:
      PYTHONUNBUFFERED: 1
      WAREHOUSE_URL: "postgresql://warehouse_user:warehouse_password@data-warehouse:5432/data_warehouse"
      TOWN_DB_URL: "postgresql://${TOWN_SERVICE_POSTGRES_USER}:${TOWN_SERVICE_POSTGRES_PASSWORD}@db_town_primary:5432,db_town_replica_1:5432,db_town_replica_2:5432/${TOWN_SERVICE_POSTGRES_DB}"
      CHARACTER_DB_URL: "postgresql://${CHARACTER_SERVICE_POSTGRES_USER}:${CHARACTER_SERVICE_POSTGRES_PASSWORD}@db_character_primary:5432,db_character_replica_1:5432,db_character_replica_2:5432/${CHARACTER_SERVICE_POSTGRES_DB}"
      TASK_DB_URL: "postgresql://${TASK_SERVICE_POSTGRES_USER}:${TASK_SERVICE_POSTGRES_PASSWORD}@db_task_primary:5432,db_task_replica_1:5432,db_task_replica_2:5432/${TASK_SERVICE_POSTGRES_DB}"
      VOTING_DB_URL: "postgresql://${VOTING_SERVICE_POSTGRES_USER}:${VOTING_SERVICE_POSTGRES_PASSWORD}@db_voting_primary:5432,db_voting_replica_1:5432,db_voting_replica_2:5432/${VOTING_SERVICE_POSTGRES_DB}"
      USER_DB_URL: "postgresql://${USER_MANAGEMENT_SERVICE_POSTGRES_USER}:${USER_MANAGEMENT_SERVICE_POSTGRES_PASSWORD}@db_user_management_service:5432/${USER_MANAGEMENT_SERVICE_POSTGRES_DB}"
      RUMOURS_DB_URL: "postgresql://${RUMOURS_SERVICE_POSTGRES_USER}:${RUMOURS_SERVICE_POSTGRES_PASSWORD}@comm-postgres-primary:5432/${RUMOURS_SERVICE_POSTGRES_DB}"
      COMMUNICATION_DB_URL: "postgresql://${COMMUNICATION_SERVICE_POSTGRES_USER}:${COMMUNICATION_SERVICE_POSTGRES_PASSWORD}@rumours-postgres-primary:5432/${COMMUNICATION_SERVICE_POSTGRES_DB}"
      SYNC_INTERVAL_SECONDS: 60
    networks:
      - app-network

  message-broker:
    build: .
    container_name: message-broker
    ports:
      - "8018:8080"
    depends_on:
      - db_message_broker
      - discovery-service
      - communication-service
      - user-management-service
    environment:
      - SPRING_APPLICATION_NAME=message-broker
      - SERVER_PORT=8080
      - DISCOVERY_SERVICE_URL=http://discovery-service:8989
      - DISCOVERY_SERVICE_GRPC_URL=discovery-service:6565
      - MESSAGE_BROKER_POSTGRES_HOST=db_message_broker
      - MESSAGE_BROKER_POSTGRES_DB_PORT=5432
      - MESSAGE_BROKER_POSTGRES_USER=${MESSAGE_BROKER_POSTGRES_USER}
      - MESSAGE_BROKER_POSTGRES_PASSWORD=${MESSAGE_BROKER_POSTGRES_PASSWORD}
      - MESSAGE_BROKER_POSTGRES_DB=${MESSAGE_BROKER_POSTGRES_DB}
      - GATEWAY_SERVICE_URL=${GATEWAY_SERVICE_URL}
    networks:
      - app-network
    deploy:
      replicas: 1
      endpoint_mode: dnsrr

  db_message_broker:
    image: postgres:17
    environment:
      - POSTGRES_USER=${MESSAGE_BROKER_POSTGRES_USER}
      - POSTGRES_PASSWORD=${MESSAGE_BROKER_POSTGRES_PASSWORD}
      - POSTGRES_DB=${MESSAGE_BROKER_POSTGRES_DB}
    volumes:
      - message_broker_postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    deploy:
      replicas: 1

  gateway-service:
    image: dimaubuntu/gateway-service:latest
    ports:
      - "8088:8080"
    depends_on:
      - communication-service
      - user-management-service
    environment:
      - SPRING_DATA_REDIS_CLUSTER_NODES=redis-node-0:6379,redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379
      - SPRING_DATA_REDIS_CLUSTER_MAX_REDIRECTS=3
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SERVICES_USER_URL=${SERVICES_USER_URL}
      - USER_MANAGEMENT_SERVICE_HOST=user-management-service
      - USER_MANAGEMENT_SERVICE_PORT=80
      - COMMUNICATION_SERVICE_HOST=communication-service
      - COMMUNICATION_SERVICE_PORT=8080
      - RUMOURS_SERVICE_HOST=rumours-service
      - RUMOURS_SERVICE_PORT=8080
      - CHARACTER_SERVICE_HOST=character-service
      - CHARACTER_SERVICE_PORT=8081
      - TOWN_SERVICE_HOST=town-service
      - TOWN_SERVICE_PORT=8080
      - GAME_SERVICE_HOST=game-service
      - GAME_SERVICE_PORT=80
      - GATEWAY_SERVICE_URL=http://gateway-service:8080
      - DISCOVERY_SERVICE_GRPC_URL=discovery-service:6565
      - TASK_SERVICE_HOST=task-service
      - TASK_SERVICE_PORT=8000
      - VOTING_SERVICE_HOST=voting-service
      - VOTING_SERVICE_PORT=8000
      - DISCOVERY_SERVICE_URL=${DISCOVERY_SERVICE_URL}
    networks:
      - app-network
    deploy:
      replicas: 1
      endpoint_mode: dnsrr

  # --- Redis Cluster Nodes ---
  redis-node-0:
    image: bitnamilegacy/redis-cluster:7.2
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    networks:
      - app-network

  redis-node-1:
    image: bitnamilegacy/redis-cluster:7.2
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    networks:
      - app-network

  redis-node-2:
    image: bitnamilegacy/redis-cluster:7.2
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    networks:
      - app-network

  redis-node-3:
    image: bitnamilegacy/redis-cluster:7.2
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    networks:
      - app-network

  redis-node-4:
    image: bitnamilegacy/redis-cluster:7.2
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    networks:
      - app-network

  redis-node-5:
    image: bitnamilegacy/redis-cluster:7.2
    depends_on:
      - redis-node-0
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
      - REDIS_CLUSTER_REPLICAS=1
      - REDIS_CLUSTER_CREATOR=yes
    networks:
      - app-network

  discovery-service:
    image: dimaubuntu/service-discovery:latest
    environment:
      - SERVER_PORT=8989
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM}
      - ALERTS_ENABLED=${ALERTS_ENABLED}
    ports:
      - "8989:8989" # REST
      - "6565:6565" # gRPC
    networks:
      - app-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://discovery-service:8989/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  town-service:
    image: dimaubuntu/town-service:latest
    environment:
      - SPRING_APPLICATION_NAME=town-service
      - SERVER_PORT=8080
      - GRPC_PORT=6565
      - DISCOVERY_SERVICE_URL=http://discovery-service:8989
      - MESSAGE_BROKER_GRPC_URL=message-broker:6565
      - TOWN_SERVICE_POSTGRES_HOST=db_town_primary
      - TOWN_SERVICE_POSTGRES_DB_PORT=5432
      - TOWN_SERVICE_POSTGRES_USER=${TOWN_SERVICE_POSTGRES_USER}
      - TOWN_SERVICE_POSTGRES_PASSWORD=${TOWN_SERVICE_POSTGRES_PASSWORD}
      - TOWN_SERVICE_POSTGRES_DB=${TOWN_SERVICE_POSTGRES_DB}
      - GATEWAY_SERVICE_URL=${GATEWAY_SERVICE_URL}
    networks:
      - app-network
    deploy:
      replicas: 2
      endpoint_mode: dnsrr

  character-service:
    image: dimaubuntu/character-service:latest
    environment:
      - SPRING_APPLICATION_NAME=character-service
      - SERVER_PORT=8081
      - DISCOVERY_SERVICE_URL=http://discovery-service:8989
      - DISCOVERY_SERVICE_GRPC_URL=discovery-service:6565
      - CHARACTER_SERVICE_POSTGRES_HOST=db_character_service
      - CHARACTER_SERVICE_POSTGRES_DB_PORT=5432
      - CHARACTER_SERVICE_POSTGRES_USER=${CHARACTER_SERVICE_POSTGRES_USER}
      - CHARACTER_SERVICE_POSTGRES_PASSWORD=${CHARACTER_SERVICE_POSTGRES_PASSWORD}
      - CHARACTER_SERVICE_POSTGRES_DB=${CHARACTER_SERVICE_POSTGRES_DB}
      - GATEWAY_SERVICE_URL=${GATEWAY_SERVICE_URL}
    networks:
      - app-network
    deploy:
      replicas: 2
      endpoint_mode: dnsrr

  db_town_primary:
    image: postgres:17
    container_name: db_town_primary
    environment:
      - POSTGRES_USER=${TOWN_SERVICE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${TOWN_SERVICE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${TOWN_SERVICE_POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=trust
    command: |
      bash -c "
      # 1. Create a bulletproof HBA file
      # This file explicitly allows EVERYTHING from ANYWHERE
      echo 'local all all trust' > /tmp/custom_pg_hba.conf
      echo 'host all all 0.0.0.0/0 trust' >> /tmp/custom_pg_hba.conf
      echo 'host replication all 0.0.0.0/0 trust' >> /tmp/custom_pg_hba.conf
      
      # 2. Set strict permissions (Postgres requires this)
      chown postgres:postgres /tmp/custom_pg_hba.conf
      chmod 600 /tmp/custom_pg_hba.conf
      
      # 3. Start Postgres pointing to our custom file
      # This BYPASSES whatever is in the data volume
      exec docker-entrypoint.sh postgres -c hba_file=/tmp/custom_pg_hba.conf -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby_feedback=on
      "
    volumes:
      - town_primary_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TOWN_SERVICE_POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  db_town_replica_1:
    image: postgres:17
    container_name: db_town_replica_1
    depends_on:
      db_town_primary:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${TOWN_SERVICE_POSTGRES_USER}
      - PGPASSWORD=${TOWN_SERVICE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${TOWN_SERVICE_POSTGRES_DB}
    volumes:
      - town_replica1_data:/var/lib/postgresql/data
      - failover_triggers:/triggers
    networks:
      - app-network
    command: |
      bash -c "
      set -e

      # 1. RESTART CHECK
      if [ -f /triggers/promote_town.done ]; then
          if [ -f /var/lib/postgresql/data/PG_VERSION ]; then
              echo '!!! ALREADY MASTER. Starting...'
              rm -f /var/lib/postgresql/data/standby.signal
              exec gosu postgres postgres
          else
              echo '!!! STALE MARKER. Resetting...'
              rm /triggers/promote_town.done
          fi
      fi

      # 2. SYNC LOOP
      while true; do
          if [ -f /triggers/promote_town ]; then
             echo '!!! FAILOVER TRIGGERED !!!'

             # COLD START LOGIC
             if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
                 if pg_isready -h db_town_primary -p 5432 -U ${TOWN_SERVICE_POSTGRES_USER}; then
                     echo 'Primary is ALIVE. Retrying sync...'
                     sleep 2
                     continue
                 else
                     echo 'WARNING: Primary Dead + No Data. Creating FRESH DB...'
                     mv /triggers/promote_town /triggers/promote_town.done
                     rm -rf /var/lib/postgresql/data/*
                     chown postgres:postgres /var/lib/postgresql/data
                     chmod 0700 /var/lib/postgresql/data

                     gosu postgres initdb -D /var/lib/postgresql/data
                     gosu postgres pg_ctl -D /var/lib/postgresql/data -w start
                     gosu postgres psql -c \"CREATE USER ${TOWN_SERVICE_POSTGRES_USER} WITH PASSWORD '${TOWN_SERVICE_POSTGRES_PASSWORD}';\"
                     gosu postgres psql -c \"ALTER USER ${TOWN_SERVICE_POSTGRES_USER} WITH SUPERUSER;\"
                     gosu postgres psql -c \"CREATE DATABASE ${TOWN_SERVICE_POSTGRES_DB} OWNER ${TOWN_SERVICE_POSTGRES_USER};\"
                     gosu postgres pg_ctl -D /var/lib/postgresql/data -m fast -w stop

                     echo \"host all all 0.0.0.0/0 trust\" >> /var/lib/postgresql/data/pg_hba.conf
                     echo 'Starting NEW Master...'
                     exec gosu postgres postgres
                 fi
             fi

             mv /triggers/promote_town /triggers/promote_town.done
             rm -f /var/lib/postgresql/data/standby.signal
             chown -R postgres:postgres /var/lib/postgresql/data
             chmod 0700 /var/lib/postgresql/data
             exec gosu postgres postgres
          fi

          if pg_isready -h db_town_primary -p 5432 -U ${TOWN_SERVICE_POSTGRES_USER}; then
              rm -rf /var/lib/postgresql/data/*
              chmod 0700 /var/lib/postgresql/data

              echo 'Attempting to create slot and backup...'
              # Attempt 1: Try to CREATE (-C) the slot
              if gosu postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R -C -S town_slot_1 --host=db_town_primary --port=5432 --username=${TOWN_SERVICE_POSTGRES_USER} --no-password; then
                  echo 'Backup Successful (New Slot)!'
                  break 
              fi

              echo 'Slot creation failed (already exists?). Retrying without creation...'
              # Attempt 2: Try to USE existing slot (No -C)
              if gosu postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R -S town_slot_1 --host=db_town_primary --port=5432 --username=${TOWN_SERVICE_POSTGRES_USER} --no-password; then
                   echo 'Backup Successful (Existing Slot)!'
                   break
              fi
          fi
          sleep 2
      done

      # 3. Watcher
      (
        while true; do
          sleep 2
          if [ -f /triggers/promote_town ]; then
            gosu postgres pg_ctl promote -D /var/lib/postgresql/data
            mv /triggers/promote_town /triggers/promote_town.done
            break
          fi
        done
      ) &
      exec gosu postgres postgres -c hot_standby=on
      "

  db_town_replica_2:
    image: postgres:17
    container_name: db_town_replica_2
    depends_on:
      db_town_primary:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${TOWN_SERVICE_POSTGRES_USER}
      - PGPASSWORD=${TOWN_SERVICE_POSTGRES_PASSWORD}
    volumes:
      - town_replica2_data:/var/lib/postgresql/data
    networks:
      - app-network
    command: |
      bash -c "
      set -e
      while true; do
          if pg_isready -h db_town_primary -p 5432 -U ${TOWN_SERVICE_POSTGRES_USER}; then
              rm -rf /var/lib/postgresql/data/*
              chmod 0700 /var/lib/postgresql/data

              echo 'Attempting to create slot and backup...'
              # Attempt 1: Try to CREATE (-C)
              if gosu postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R -C -S town_slot_2 --host=db_town_primary --port=5432 --username=${TOWN_SERVICE_POSTGRES_USER} --no-password; then
                  echo 'Backup Successful (New Slot)!'
                  break 
              fi

              echo 'Slot creation failed. Retrying with existing slot...'
              # Attempt 2: Try to USE existing (No -C)
              if gosu postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R -S town_slot_2 --host=db_town_primary --port=5432 --username=${TOWN_SERVICE_POSTGRES_USER} --no-password; then
                   echo 'Backup Successful (Existing Slot)!'
                   break
              fi
          fi
          sleep 2
      done
      chown -R postgres:postgres /var/lib/postgresql/data
      chmod 0700 /var/lib/postgresql/data
      exec gosu postgres postgres -c hot_standby=on
      "

  db_character_primary:
    image: postgres:17
    container_name: db_character_primary
    environment:
      - POSTGRES_USER=${CHARACTER_SERVICE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${CHARACTER_SERVICE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${CHARACTER_SERVICE_POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=trust
    command: |
      bash -c "
      # 1. Create a bulletproof HBA file
      echo 'local all all trust' > /tmp/custom_pg_hba.conf
      echo 'host all all 0.0.0.0/0 trust' >> /tmp/custom_pg_hba.conf
      echo 'host replication all 0.0.0.0/0 trust' >> /tmp/custom_pg_hba.conf

      # 2. Set strict permissions
      chown postgres:postgres /tmp/custom_pg_hba.conf
      chmod 600 /tmp/custom_pg_hba.conf

      # 3. Start Postgres pointing to our custom file
      exec docker-entrypoint.sh postgres -c hba_file=/tmp/custom_pg_hba.conf -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby_feedback=on
      "
    volumes:
      - character_primary_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CHARACTER_SERVICE_POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  db_character_replica_1:
    image: postgres:17
    container_name: db_character_replica_1
    depends_on:
      db_character_primary:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${CHARACTER_SERVICE_POSTGRES_USER}
      - PGPASSWORD=${CHARACTER_SERVICE_POSTGRES_PASSWORD}
      - POSTGRES_DB=${CHARACTER_SERVICE_POSTGRES_DB}
    volumes:
      - character_replica1_data:/var/lib/postgresql/data
      - failover_triggers:/triggers
    networks:
      - app-network
    command: |
      bash -c "
      set -e

      # 1. RESTART CHECK
      if [ -f /triggers/promote_character.done ]; then
          if [ -f /var/lib/postgresql/data/PG_VERSION ]; then
              echo '!!! ALREADY MASTER. Starting...'
              rm -f /var/lib/postgresql/data/standby.signal
              exec gosu postgres postgres
          else
              echo '!!! STALE MARKER (No Data). Resetting...'
              rm /triggers/promote_character.done
          fi
      fi

      # 2. SYNC LOOP
      while true; do
          if [ -f /triggers/promote_character ]; then
             echo '!!! FAILOVER TRIGGERED !!!'

             # COLD START LOGIC
             if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
                 if pg_isready -h db_character_primary -p 5432 -U ${CHARACTER_SERVICE_POSTGRES_USER}; then
                     echo 'Primary is ALIVE. Retrying sync...'
                     sleep 2
                     continue
                 else
                     echo 'WARNING: Primary Dead + No Data. Creating FRESH DB...'
                     mv /triggers/promote_character /triggers/promote_character.done
                     rm -rf /var/lib/postgresql/data/*
                     chown postgres:postgres /var/lib/postgresql/data
                     chmod 0700 /var/lib/postgresql/data

                     gosu postgres initdb -D /var/lib/postgresql/data
                     gosu postgres pg_ctl -D /var/lib/postgresql/data -w start
                     # Create User & DB using env vars
                     gosu postgres psql -c \"CREATE USER ${CHARACTER_SERVICE_POSTGRES_USER} WITH PASSWORD '${CHARACTER_SERVICE_POSTGRES_PASSWORD}';\"
                     gosu postgres psql -c \"ALTER USER ${CHARACTER_SERVICE_POSTGRES_USER} WITH SUPERUSER;\"
                     gosu postgres psql -c \"CREATE DATABASE ${CHARACTER_SERVICE_POSTGRES_DB} OWNER ${CHARACTER_SERVICE_POSTGRES_USER};\"
                     gosu postgres pg_ctl -D /var/lib/postgresql/data -m fast -w stop

                     echo \"host all all 0.0.0.0/0 trust\" >> /var/lib/postgresql/data/pg_hba.conf
                     echo 'Starting NEW Master...'
                     exec gosu postgres postgres
                 fi
             fi

             mv /triggers/promote_character /triggers/promote_character.done
             rm -f /var/lib/postgresql/data/standby.signal
             chown -R postgres:postgres /var/lib/postgresql/data
             chmod 0700 /var/lib/postgresql/data
             exec gosu postgres postgres
          fi

          if pg_isready -h db_character_primary -p 5432 -U ${CHARACTER_SERVICE_POSTGRES_USER}; then
              rm -rf /var/lib/postgresql/data/*
              chmod 0700 /var/lib/postgresql/data

              # Smart Backup: Try Create (-C), fallback to Use (-S)
