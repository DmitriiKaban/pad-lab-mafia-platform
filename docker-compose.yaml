version: '3.8'
services:
  db_town_service:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${TOWN_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TOWN_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TOWN_SERVICE_POSTGRES_DB}
    ports:
      - "${TOWN_SERVICE_POSTGRES_DB_PORT}:5432"
    volumes:
      - town_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOWN_SERVICE_POSTGRES_USER} -d ${TOWN_SERVICE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_user_management_service:
    image: postgres:14
    environment:
      POSTGRES_USER: ${USER_MANAGEMENT_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_MANAGEMENT_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_MANAGEMENT_SERVICE_POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - user_management_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_MANAGEMENT_SERVICE_POSTGRES_USER} -d ${USER_MANAGEMENT_SERVICE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  town_service:
    image: dimaubuntu/town-service:0.5
    environment:
      TOWN_SERVICE_POSTGRES_HOST: db_town_service
      TOWN_SERVICE_POSTGRES_DB_PORT: 5432
      TOWN_SERVICE_POSTGRES_USER: ${TOWN_SERVICE_POSTGRES_USER}
      TOWN_SERVICE_POSTGRES_PASSWORD: ${TOWN_SERVICE_POSTGRES_PASSWORD}
      TOWN_SERVICE_POSTGRES_DB: ${TOWN_SERVICE_POSTGRES_DB}
      SERVER_PORT: 8080
    ports:
      - "8082:8080"
    depends_on:
      db_town_service:
        condition: service_healthy
    networks:
      - app_network

  db_character_service:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${CHARACTER_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHARACTER_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CHARACTER_SERVICE_POSTGRES_DB}
    ports:
      - "${CHARACTER_SERVICE_POSTGRES_DB_PORT}:5432"
    volumes:
      - character_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHARACTER_SERVICE_POSTGRES_USER} -d ${CHARACTER_SERVICE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  character_service:
    image: dimaubuntu/character-service:0.6
    environment:
      CHARACTER_SERVICE_POSTGRES_HOST: db_character_service
      CHARACTER_SERVICE_POSTGRES_DB_PORT: 5432
      CHARACTER_SERVICE_POSTGRES_USER: ${CHARACTER_SERVICE_POSTGRES_USER}
      CHARACTER_SERVICE_POSTGRES_PASSWORD: ${CHARACTER_SERVICE_POSTGRES_PASSWORD}
      CHARACTER_SERVICE_POSTGRES_DB: ${CHARACTER_SERVICE_POSTGRES_DB}
      SERVER_PORT: 8081
    ports:
      - "8083:8081"
    depends_on:
      db_character_service:
        condition: service_healthy
    networks:
      - app_network


  user_management_service:
    image: alexandrina581/user-management-service:latest
    environment:
      USER_MANAGEMENT_SERVICE_POSTGRES_HOST: db_user_management_service
      USER_MANAGEMENT_SERVICE_POSTGRES_DB_PORT: 5432
      USER_MANAGEMENT_SERVICE_POSTGRES_USER: ${USER_MANAGEMENT_SERVICE_POSTGRES_USER}
      USER_MANAGEMENT_SERVICE_POSTGRES_PASSWORD: ${USER_MANAGEMENT_SERVICE_POSTGRES_PASSWORD}
      USER_MANAGEMENT_SERVICE_POSTGRES_DB: ${USER_MANAGEMENT_SERVICE_POSTGRES_DB}
    command: uvicorn app.main:app --host 0.0.0.0 --port 80
    ports:
      - "8060:80"
    depends_on:
      db_user_management_service:
        condition: service_healthy
    networks:
      - app_network
      
  db_rumours_service:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${RUMOURS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RUMOURS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RUMOURS_POSTGRES_DB}
    ports:
      - "${RUMOURS_POSTGRES_DB_PORT}:5432"
    volumes:
      - rumours_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUMOURS_POSTGRES_USER} -d ${RUMOURS_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rumours_service:
    image: m1rrerror/mafia-rumours-service:v1.3.0
    environment:
      DB_CONNECTION_STRING: "Host=db_rumours_service;Port=5432;Database=${RUMOURS_POSTGRES_DB};Username=${RUMOURS_POSTGRES_USER};Password=${RUMOURS_POSTGRES_PASSWORD}"
      CURRENCY_SERVICE_URL: ${CURRENCY_SERVICE_URL}
    ports:
      - "8084:8080"
    depends_on:
      db_rumours_service:
        condition: service_healthy
    networks:
      - app_network

  db_communication_service:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${COMM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${COMM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${COMM_POSTGRES_DB}
    ports:
      - "${COMM_POSTGRES_DB_PORT}:5432"
    volumes:
      - communication_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMM_POSTGRES_USER} -d ${COMM_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  communication_service:
    image: m1rrerror/mafia-communication-service:v1.1.0
    environment:
      ConnectionStrings__DefaultConnection: "Host=db_communication_service;Port=5432;Database=${COMM_POSTGRES_DB};Username=${COMM_POSTGRES_USER};Password=${COMM_POSTGRES_PASSWORD}"
    ports:
      - "8085:8080"
    depends_on:
      db_communication_service:
        condition: service_healthy
    networks:
      - app_network

  db_voting_service:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${VOTING_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${VOTING_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${VOTING_SERVICE_POSTGRES_DB}
    ports:
      - "${VOTING_SERVICE_POSTGRES_PORT}:5432"
    volumes:
      - voting_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VOTING_SERVICE_POSTGRES_USER} -d ${VOTING_SERVICE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  voting_service:
    image: iraned/voting-service:1.2
    environment:
      VOTING_SERVICE_POSTGRES_USER: ${VOTING_SERVICE_POSTGRES_USER}
      VOTING_SERVICE_POSTGRES_PASSWORD: ${VOTING_SERVICE_POSTGRES_PASSWORD}
      VOTING_SERVICE_POSTGRES_DB: ${VOTING_SERVICE_POSTGRES_DB}
      VOTING_SERVICE_POSTGRES_HOST: db_voting_service
      VOTING_SERVICE_POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db_voting_service:
        condition: service_healthy
    networks:
      - app_network


  task-service-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TASK_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TASK_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TASK_SERVICE_POSTGRES_DB}
    ports:
      - "5469:5432"
    volumes:
      - task_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TASK_SERVICE_POSTGRES_USER} -d ${TASK_SERVICE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  task-service:
    image: iraned/task-service:1.2
    env_file:
      - .env
    environment:
      POSTGRES_HOST: "task-service-db"
      POSTGRES_PORT: "5432"
    depends_on:
      task-service-db:
        condition: service_healthy
    networks:
      - app_network
    ports:
      - "8001:8000"
  # Roleplay Service Database
  db_roleplay_service:
    image: postgres:15
    environment:
      POSTGRES_USER: ${ROLEPLAY_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ROLEPLAY_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ROLEPLAY_SERVICE_POSTGRES_DB}
    ports:
      - "${ROLEPLAY_SERVICE_POSTGRES_PORT}:5432"
    volumes:
      - roleplay_postgres_data:/var/lib/postgresql/data
      - ./roleplay-init-db.sh:/docker-entrypoint-initdb.d/roleplay-init-db.sh:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ROLEPLAY_SERVICE_POSTGRES_USER} -d ${ROLEPLAY_SERVICE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Roleplay Service
  roleplay_service:
    image: ${ROLEPLAY_SERVICE_IMAGE}:${ROLEPLAY_SERVICE_TAG}
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNET_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=db_roleplay_service;Port=5432;Database=${ROLEPLAY_SERVICE_POSTGRES_DB};Username=${ROLEPLAY_SERVICE_POSTGRES_USER};Password=${ROLEPLAY_SERVICE_POSTGRES_PASSWORD};Include Error Detail=true
    ports:
      - "${ROLEPLAY_SERVICE_PORT}:80"
    depends_on:
      db_roleplay_service:
        condition: service_healthy
    networks:
      - app_network

  db_shop_service:
    image: postgres:15
    environment:
      POSTGRES_USER: ${SHOP_SERVICE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SHOP_SERVICE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SHOP_SERVICE_POSTGRES_DB}
    ports:
      - "${SHOP_SERVICE_POSTGRES_PORT}:5432"
    volumes:
      - shop_postgres_data:/var/lib/postgresql/data
      - ./shop-init-db.sh:/docker-entrypoint-initdb.d/shop-init-db.sh:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHOP_SERVICE_POSTGRES_USER} -d ${SHOP_SERVICE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  shop_service:
    image: ${SHOP_SERVICE_IMAGE}:${SHOP_SERVICE_TAG}
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNET_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=db_shop_service;Port=5432;Database=${SHOP_SERVICE_POSTGRES_DB};Username=${SHOP_SERVICE_POSTGRES_USER};Password=${SHOP_SERVICE_POSTGRES_PASSWORD};Include Error Detail=true
      - UserServiceUrl=http://user_management_service:80
      - CharacterServiceUrl=http://character_service:8081
      - GameServiceUrl=http://town_service:8080
    ports:
      - "${SHOP_SERVICE_PORT}:80"
    depends_on:
      db_shop_service:
        condition: service_healthy
      user_management_service:
        condition: service_started
      character_service:
        condition: service_started
      town_service:
        condition: service_started
    networks:
      - app_network
      
volumes:
  voting_postgres_data:
  task_pgdata:
  town_postgres_data:
  character_postgres_data:
  user_management_postgres_data:
  rumours_postgres_data:
  communication_postgres_data:

networks:
  app_network: